version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: production
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /app
      - /spoolmansync-ha-addon
    schedule:
      interval: weekly
